name: Build & publish a Factorio release

# Packages one Factorio headless version: build the image, prove it runs a
# server, push it to the registry and publish a GitHub release carrying the
# upstream changelog and a link to the forum announcement.

on:
  workflow_call:
    inputs:
      version:
        description: Factorio version to package, e.g. 2.0.77
        required: true
        type: string
      sha256:
        description: SHA-256 of the upstream headless tarball (looked up when empty)
        required: false
        type: string
        default: ""
      channels:
        description: Comma separated release channels (looked up when empty)
        required: false
        type: string
        default: ""
      publish:
        description: Push the image and create the GitHub release
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: Factorio version to package, e.g. 2.0.77
        required: true
        type: string
      publish:
        description: Push the image and create the GitHub release
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Factorio ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Untrusted-ish inputs never reach a `run:` script through ${{ }}.
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_SHA256: ${{ inputs.sha256 }}
      INPUT_CHANNELS: ${{ inputs.channels }}
      REGISTRY: ghcr.io
      LOCAL_TAG: factorio-headless:test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare build context
        id: context
        run: |
          set -euo pipefail
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Resolve build metadata
        id: meta
        env:
          IMAGE: ${{ steps.context.outputs.image }}
        run: |
          set -euo pipefail
          python3 scripts/build_metadata.py \
            --version "$INPUT_VERSION" \
            --sha256 "$INPUT_SHA256" \
            --channels "$INPUT_CHANNELS" \
            --image "$IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Factorio headless release is published for linux64 only, so the
      # image is amd64-only by definition.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: factorio-headless:test
          build-args: |
            FACTORIO_VERSION=${{ steps.meta.outputs.version }}
            FACTORIO_SHA256=${{ steps.meta.outputs.sha256 }}
            BUILD_DATE=${{ steps.context.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: tests/smoke-test.sh "$LOCAL_TAG" "$VERSION"

      - name: Render the release notes
        env:
          IMAGE: ${{ steps.context.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CHANNELS: ${{ steps.meta.outputs.channels }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The changelog Wube ships inside the release is the authoritative
          # source for the notes, so take it from the image we just built.
          docker run --rm --entrypoint cat "$LOCAL_TAG" \
            /opt/factorio/data/changelog.txt > changelog.txt
          python3 scripts/release_notes.py \
            --version "$VERSION" \
            --changelog changelog.txt \
            --image "$IMAGE" \
            --tags "$TAGS" \
            --channels "$CHANNELS" \
            --sha256 "$SHA256" \
            --output release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to the container registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: inputs.publish
        env:
          FULL_TAGS: ${{ steps.meta.outputs.full_tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Pushing $tag"
            docker tag "$LOCAL_TAG" "$tag"
            docker push "$tag"
          done <<< "$FULL_TAGS"

      - name: Publish the GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "Factorio $VERSION (headless)" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, updating it"
            gh release edit "v$VERSION" "${args[@]}"
          else
            gh release create "v$VERSION" "${args[@]}" --target "$GITHUB_SHA"
          fi
